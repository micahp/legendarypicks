name: SLC V2 kicker team-code regression
on:
  pull_request:
    branches:
      - slc-v2
    paths:
      - 'scripts/nfl_sequence/kicker_field_goals.py'
      - 'scripts/nfl_sequence/test_kicker_field_goals.py'
      - '.github/workflows/slc-v2-kicker-alias-tests.yml'
  push:
    paths:
      - 'scripts/nfl_sequence/kicker_field_goals.py'
      - 'scripts/nfl_sequence/test_kicker_field_goals.py'
      - '.github/workflows/slc-v2-kicker-alias-tests.yml'
permissions:
  contents: read
jobs:
  kicker-code-alias-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SLC test dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 pandas==2.2.3 pytz==2024.2 pyarrow==22.0.0
      - name: Check team-code mapping and pinned kicker reference
        run: |
          python -m py_compile scripts/nfl_sequence/kicker_field_goals.py
          PYTHONPATH=scripts/nfl_sequence python -m unittest -v test_kicker_field_goals
