name: SLC transition accounting

on:
  push:
    branches: [slc-v2, main]
    paths:
      - 'scripts/nfl_sequence/game_state.py'
      - 'scripts/nfl_sequence/e1_drive.py'
      - 'scripts/nfl_sequence/slc_engine.py'
      - 'scripts/nfl_sequence/slc_outputs.py'
      - 'scripts/nfl_sequence/pre_event.py'
      - 'scripts/nfl_sequence/reducer.py'
      - 'scripts/nfl_sequence/game_legality.py'
      - 'scripts/nfl_sequence/test_transition_accounting.py'
      - 'scripts/nfl_sequence/test_blocked_kick_outcomes.py'
      - 'scripts/nfl_sequence/test_game_legality.py'
      - '.github/workflows/slc-transition-accounting.yml'
  pull_request:
    branches: [slc-v2, main]
    paths:
      - 'scripts/nfl_sequence/game_state.py'
      - 'scripts/nfl_sequence/e1_drive.py'
      - 'scripts/nfl_sequence/slc_engine.py'
      - 'scripts/nfl_sequence/slc_outputs.py'
      - 'scripts/nfl_sequence/pre_event.py'
      - 'scripts/nfl_sequence/reducer.py'
      - 'scripts/nfl_sequence/game_legality.py'
      - 'scripts/nfl_sequence/test_transition_accounting.py'
      - 'scripts/nfl_sequence/test_blocked_kick_outcomes.py'
      - 'scripts/nfl_sequence/test_game_legality.py'
      - '.github/workflows/slc-transition-accounting.yml'

jobs:
  accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Field-state invariants and corruption probes
        run: python3 -m unittest discover -s scripts/nfl_sequence -p 'test_transition_accounting.py' -v
      - name: Blocked kick historical and projection tests
        run: python3 -m unittest discover -s scripts/nfl_sequence -p 'test_blocked_kick_outcomes.py' -v
      - name: Independent full-record legality tests
        run: python3 -m unittest discover -s scripts/nfl_sequence -p 'test_game_legality.py' -v
