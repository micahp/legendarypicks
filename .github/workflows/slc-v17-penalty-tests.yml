name: V1.7 penalty probability model tests

on:
  push:
    branches:
      - feature/slc-v1.7-penalty-model-2026-11-12
      - feature/slc-v1.7-enforce-all-16-2026-11-12
      - fix/slc-v17-scrimmage-kick-transitions-2026-11-12
      - fix/slc-v17-fractional-state-precision-2026-11-13
      - fix/slc-v17-validity-and-seed-failures-2026-11-13
  pull_request:
    branches:
      - feature/slc-v1.7-penalty-model-2026-11-12
      - fix/slc-v17-scrimmage-kick-transitions-2026-11-12
      - fix/slc-v17-fractional-state-precision-2026-11-13
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-python-penalty-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install play-call test dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 pytz==2024.2 pandas==2.2.3 pyarrow==22.0.0
      - name: Compile all changed game-engine entrypoints
        run: |
          python -m py_compile scripts/nfl_sequence/e1_drive.py \
            scripts/nfl_sequence/game_state.py scripts/nfl_sequence/slc_playcall.py \
            scripts/nfl_sequence/slc_engine.py scripts/nfl_sequence/slc_config.py \
            scripts/nfl_sequence/simulate_pregame_batch.py \
            scripts/nfl_sequence/penalty_game.py scripts/nfl_sequence/penalty_rulings.py
      - name: Run V1.7 penalty model regressions
        run: |
          PYTHONPATH=scripts/nfl_sequence python -m unittest -v \
            test_penalty_fit test_penalty_sampler test_penalty_train \
            test_penalty_enforcement test_penalty_transition \
            test_penalty_scrimmage_kick test_penalty_game_loop \
            test_penalty_full_game_fixture test_penalty_profile_integration \
            test_penalty_research_rulings test_penalty_research_summary \
            test_penalty_goal_line_fumble test_penalty_fractional_state \
            test_penalty_v17_failure_repairs
      - name: Full game reducer, player and team accounting, and box-score regression suites
        run: |
          PYTHONPATH=scripts/nfl_sequence python -m unittest -v \
            test_game_state test_slc_outputs test_slc_engine
      - name: Run legacy game-state scoring, field-goal and batch/registry compatibility checks
        run: |
          PYTHONPATH=scripts/nfl_sequence python -m unittest -v \
            test_game_state.GameStatsReconciliation \
            test_game_state.MissedFieldGoalBoundaries \
            test_game_state.MissedFieldGoalTransition \
            test_pregame_batch.BatchAggregation.test_all_seeds_are_retained_and_ties_are_in_regulation_distribution \
            test_pregame_batch.BatchAggregation.test_market_pushes_and_missing_valid_samples_are_explicit \
            test_pregame_batch.BatchAggregation.test_regulation_tie_is_not_misreported_as_a_partial_game \
            test_pregame_batch.BatchAggregation.test_overtime_final_tie_is_not_misclassified_as_a_regulation_tie \
            test_pregame_batch.BatchAggregation.test_refuses_missing_or_duplicate_seed_rows
