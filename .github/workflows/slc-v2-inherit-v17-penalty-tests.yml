name: V2 carry-forward V1.7 penalty core tests

on:
  push:
    branches:
      - feature/slc-v2-inherit-v17-penalty-engine-2026-11-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  penalty-core-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V1.7 model and enforcement compatibility on V2
        run: |
          PYTHONPATH=scripts/nfl_sequence python -m unittest -v \
            test_penalty_fit test_penalty_sampler \
            test_penalty_enforcement test_penalty_transition
