name: SLC portable package offline contracts
on:
  push:
    paths:
      - 'scripts/nfl_sequence/portable_model_pack.py'
      - 'scripts/nfl_sequence/test_portable_model_pack.py'
      - 'scripts/nfl_sequence/compile_portable_pack.py'
      - 'scripts/nfl_sequence/simulate_portable_pack.py'
      - 'scripts/nfl_sequence/slc_cli.py'
      - 'scripts/nfl_sequence/run_portable_batch.py'
      - 'scripts/nfl_sequence/test_shared_portable_workers.py'
      - '.github/workflows/slc-portable-pack-tests.yml'
  pull_request:
    paths:
      - 'scripts/nfl_sequence/portable_model_pack.py'
      - 'scripts/nfl_sequence/test_portable_model_pack.py'
      - 'scripts/nfl_sequence/compile_portable_pack.py'
      - 'scripts/nfl_sequence/simulate_portable_pack.py'
      - 'scripts/nfl_sequence/slc_cli.py'
      - 'scripts/nfl_sequence/run_portable_batch.py'
      - 'scripts/nfl_sequence/test_shared_portable_workers.py'
      - '.github/workflows/slc-portable-pack-tests.yml'
permissions:
  contents: read
jobs:
  portable-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific runtime
        run: python -m pip install numpy scipy
      - name: Offline portable codec and CLI tests
        env:
          PYTHONPATH: .:backend:scripts/nfl_sequence
        run: |
          python -m unittest discover -s scripts/nfl_sequence -p test_portable_model_pack.py -v
          python -m unittest discover -s scripts/nfl_sequence -p test_shared_portable_workers.py -v
          python -m unittest discover -s scripts/nfl_sequence -p test_run_portable_batch.py -v
