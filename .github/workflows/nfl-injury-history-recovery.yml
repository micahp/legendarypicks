name: Recover NFL 2026 injury Weeks 2-9

on:
  push:
    branches:
      - research/nfl-injury-weeks-2-9-recovery-2026-11-13
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-injury-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source parquet reader
        run: python -m pip install pyarrow==22.0.0
      - name: Run injury-cutoff regression tests
        run: PYTHONPATH=backend python -m unittest -v test_recover_nfl_injury_weeks test_reconstruct_nfl_roster_asof
      - name: Fetch published 2026 injury rows and historical game schedule
        run: |
          mkdir -p /tmp/lp-nfl-injuries
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/nflverse/nflverse-data/releases/download/injuries/injuries_2026.parquet \
            --output /tmp/lp-nfl-injuries/injuries_2026.parquet
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/nflverse/nflverse-data/releases/download/schedules/games.csv \
            --output /tmp/lp-nfl-injuries/games.csv
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/nflverse/nflverse-data/releases/download/depth_charts/depth_charts_2026.parquet \
            --output /tmp/lp-nfl-injuries/depth_charts_2026.parquet
      - name: Extract all Week 2-9 reports and classify source timestamp evidence
        run: |
          PYTHONPATH=backend python backend/recover_nfl_injury_weeks.py \
            --artifact /tmp/lp-nfl-injuries/injuries_2026.parquet \
            --schedule-csv /tmp/lp-nfl-injuries/games.csv \
            --out-dir /tmp/lp-nfl-injuries/recovered
          cat /tmp/lp-nfl-injuries/recovered/README.md
      - name: Reconstruct game-specific historical depth chart by pre-kickoff timestamp
        run: |
          PYTHONPATH=backend python backend/reconstruct_nfl_roster_asof.py \
            --depth-parquet /tmp/lp-nfl-injuries/depth_charts_2026.parquet \
            --injury-csv /tmp/lp-nfl-injuries/recovered/nfl-injury-weeks-2-9.csv \
            --schedule-csv /tmp/lp-nfl-injuries/games.csv \
            --out-dir /tmp/lp-nfl-injuries/roster-asof
          cat /tmp/lp-nfl-injuries/roster-asof/asof-depth-injury-coverage.json
      - name: Inspect official Week 7 inactive HTML for stable extraction
        continue-on-error: true
        run: |
          python -m pip install beautifulsoup4==4.14.2
          curl --fail --location --retry 2 --silent --show-error \
            -A "Mozilla/5.0" \
            https://amp.nfl.com/news/nfl-week-7-inactives-players-ruled-out-sunday-2026-season \
            -o /tmp/lp-nfl-injuries/official-week7-inactives.html
          python - <<'PY'
          from bs4 import BeautifulSoup
          html=open('/tmp/lp-nfl-injuries/official-week7-inactives.html').read()
          soup=BeautifulSoup(html,'html.parser')
          print("htmlbytes",len(html))
          for h in soup.find_all(['h3'])[:3]:
              print('TEAM',repr(h.get_text(" ",strip=True)), 'parentparent',h.parent.parent.name)
              print('PARENT_HTML',str(h.parent)[:2200])
              print('CONTAINER_HTML',str(h.parent.parent)[:3600])
          PY
      - name: Preserve source and extracted injury weeks in this research branch
        if: github.event_name == 'push'
        run: |
          output=docs/research/nfl-injury-history-2026-weeks2-9
          mkdir -p "$output"
          if [ ! -f "$output/nfl-injury-week-coverage.json" ]; then
            cp /tmp/lp-nfl-injuries/recovered/* "$output/"
            cp /tmp/lp-nfl-injuries/injuries_2026.parquet "$output/source-injuries_2026.parquet"
            cp /tmp/lp-nfl-injuries/games.csv "$output/source-games.csv"
          fi
          if [ ! -f "$output/asof-depth-injury-coverage.json" ]; then
            cp /tmp/lp-nfl-injuries/roster-asof/* "$output/"
          fi
          if [ -z "$(git status --short -- "$output")" ]; then
            echo "All historical outputs already pinned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$output"
          git commit -m "Pin downloaded 2026 NFL injury weeks 2-9 source and recovery results"
          git push origin HEAD:refs/heads/research/nfl-injury-weeks-2-9-recovery-2026-11-13
      - name: Upload reusable source and recovered injury-week data
        uses: actions/upload-artifact@v4
        with:
          name: nfl-injury-2026-weeks2-9-recovery
          path: |
            /tmp/lp-nfl-injuries/injuries_2026.parquet
            /tmp/lp-nfl-injuries/games.csv
            /tmp/lp-nfl-injuries/depth_charts_2026.parquet
            /tmp/lp-nfl-injuries/recovered/
            /tmp/lp-nfl-injuries/roster-asof/
          retention-days: 30
