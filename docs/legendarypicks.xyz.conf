# Staged nginx vhost for legendarypicks.xyz
# Install: sudo cp this to /etc/nginx/sites-available/legendarypicks.xyz.conf
# then: ln -s ../sites-available/legendarypicks.xyz.conf /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
# certbot --nginx -d legendarypicks.xyz -d www.legendarypicks.xyz --redirect (after DNS resolves)
server {
    listen 80;
    listen [::]:80;
    server_name legendarypicks.xyz www.legendarypicks.xyz;

    # Frontend (Next.js) — bound to loopback in docker-compose (host port 3100)
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # API — preserve /api/ because the backend routes include that prefix.
    # The mock-draft pool is a large public read. Stream it instead of spilling
    # a slow-client response into nginx's host-level proxy temp directory.
    # This retains the same loopback-only backend target and request headers.
    location = /api/nfl/mock-draft/pool {
        proxy_pass http://127.0.0.1:8100;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # light rate-limit hook (define limit_req_zone in http{} if you want it active)
        # limit_req zone=lp_api burst=20 nodelay;
    }

    # The SQLite DB lives only inside the backend container (no port, no static route).
    # Nothing here serves data/ — DB is NOT externally reachable by design.
}
