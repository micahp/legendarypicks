<svg xmlns="http://www.w3.org/2000/svg" width="800" height="649" viewBox="0 0 800 649" role="img" aria-labelledby="title desc"><title id="title">Madden 64 vs. the 1997 NFL</title><desc id="desc">Combined offensive opportunities / plays per 60 min / game: Madden 64 235, 1997 NFL 128; Combined points per 60 min / scheduled game: Madden 64 46.3, 1997 NFL 41.5; Net yards per offensive opportunity / play: Madden 64 3.03, 1997 NFL 4.94; Completion percentage: Madden 64 38.73%, 1997 NFL 56.2%; Interception percentage: Madden 64 8.01%, 1997 NFL 3.05%; Rushing yards per carry: Madden 64 0.91, 1997 NFL 3.98</desc><rect width="800" height="649" fill="#ffffff" rx="12"/><rect x="18" y="45" width="764" height="595" rx="15" fill="#fafafa" stroke="#dddddd"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="31" font-size="20" fill="#17212b" font-weight="600" text-anchor="start">Madden 64 vs. the 1997 NFL</text><text x="35" y="72" font-size="14" fill="#17212b" font-weight="600" text-anchor="start">Combined offensive opportunities / plays per 60 min / game</text><text x="35" y="98" font-size="13" fill="#545e69" font-weight="400" text-anchor="start">Madden 64</text><rect x="153" y="85" width="550.00" height="17" rx="5" fill="#64748b"/><text x="765" y="98" font-size="14" fill="#17212b" font-weight="600" text-anchor="end">235</text><text x="35" y="125" font-size="13" fill="#545e69" font-weight="400" text-anchor="start">1997 NFL</text><rect x="153" y="112" width="299.06" height="17" rx="5" fill="#0d9185"/><text x="765" y="125" font-size="14" fill="#17212b" font-weight="600" text-anchor="end">128</text><text x="35" y="154" font-size="14" fill="#17212b" font-weight="600" text-anchor="start">Combined points per 60 min / scheduled game</text><text x="35" y="180" font-size="13" fill="#545e69" font-weight="400" text-anchor="start">Madden 64</text><rect x="153" y="167" width="550.00" height="17" rx="5" fill="#64748b"/><text x="765" y="180" font-size="14" fill="#17212b" font-weight="6