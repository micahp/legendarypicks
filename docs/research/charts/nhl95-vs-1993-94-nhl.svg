<svg xmlns="http://www.w3.org/2000/svg" width="800" height="485" viewBox="0 0 800 485" role="img" aria-labelledby="title desc"><title id="title">NHL ’95 vs. the 1993–94 NHL</title><desc id="desc">Combined shots per 60 min / scheduled game: NHL ’95 ≈116, 1993–94 NHL 60.4; Combined goals per 60 min / scheduled game: NHL ’95 ≈6.7, 1993–94 NHL 6.48; Save percentage: NHL ’95 ≈94%, 1993–94 NHL 89.5%; Power-play conversion (pooled pilot): NHL ’95 9.7%, 1993–94 NHL 18.6%</desc><rect width="800" height="485" fill="#ffffff" rx="12"/><rect x="18" y="45" width="764" height="431" rx="15" fill="#fafafa" stroke="#dddddd"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="31" font-size="20" fill="#17212b" font-weight="600" text-anchor="start">NHL ’95 vs. the 1993–94 NHL</text><text x="35" y="72" font-size="14" fill="#17212b" font-weight="600" text-anchor="start">Combined shots per 60 min / scheduled game</text><text x="35" y="98" font-size="13" fill="#545e69" font-weight="400" text-anchor="start">NHL ’95</text><rect x="153" y="85" width="550.00" height="17" rx="5" fill="#64748b"/><text x="765" y="98" font-size="14" fill="#17212b" font-weight="600" text-anchor="end">≈116</text><text x="35" y="125" font-size="13" fill="#545e69" font-weight="400" text-anchor="start">1993–94 NHL</text><rect x="153" y="112" width="286.38" height="17" rx="5" fill="#0d9185"/><text x="765" y="125" font-size="14" fill="#17212b" font-weight="600" text-anchor="end">60.4</text><text x="35" y="154" font-size="14" fill="#17212b" font-weight="600" text-anchor="start">Combined goals per 60 min / scheduled game</text><text x="35" y="180" font-size="13" fill="#545e69" font-weight="400" text-anchor="start">NHL ’95</text><rect x="153" y="167" width="550.00" height="17" rx="5" fill="#64748b"/><text x="765" y="180" font-size="14" fill="#17212b" font-weight="600" text-anchor="end">≈6.7</text><text x="35" y="207" font-size="13" fill="#545e69" font-weight="400" text-anchor="start">1993–94 NHL</text><rect x="153" y="194" width="531.94" height="17" rx="5" fill="#0d9185"/><text x="765" y="207" font-size="14" fill="#17212b" font-weight="600" text-anchor="end">6.48</text><text x="35" y="236" font-size="14" fill="#17212b" font-weight="600" text-anchor="start">Save percentage</text><text x="35" y="262" font-size="13" fill="#545e69" font-weight="400" text-anchor="start">NHL ’95</text><rect x="153" y="249" width="550.00" height="17" rx="5" fill="#64748b"/><text x="765" y="262" font-size="14" fill="#17212b" font-weight="600" text-anchor="end">≈94%</text><text x="35" y="289" font-size="13" fill="#545e69" font-weight="400" text-anchor="start">1993–94 NHL</text><rect x="153" y="276" width="523.67" height="17" rx="5" fill="#0d9185"/><text x="765" y="289" font-size="14" fill="#17212b" font-weight="600" text-anchor="end">89.5%</text><text x="35" y="318" font-size="14" fill="#17212b" font-weight="600" text-anchor="start">Power-play conversion (pooled pilot)</text><text x="35" y="344" font-size="13" fill="#545e69" font-weight="400" text-anchor="start">NHL ’95</text><rect x="153" y="331" width="287.19" height="17" rx="5" fill="#64748b"/><text x="765" y="344" font-size="14" fill="#17212b" font-weight="600" text-anchor="end">9.7%</text><text x="35" y="371" font-size="13" fill="#545e69" font-weight="400" text-anchor="start">1993–94 NHL</text><rect x="153" y="358" width="550.00" height="17" rx="5" fill="#0d9185"/><text x="765" y="371" font-size="14" fill="#17212b" font-weight="600" text-anchor="end">18.6%</text><text x="35" y="405" font-size="12" fill="#545e69" font-weight="400" text-anchor="start">Genesis CPU pilot: 30 games (10 each at 5-, 10-, 20-minute periods); one matchup.</text><text x="35" y="424" font-size="12" fill="#545e69" font-weight="400" text-anchor="start">Pilot goals ≈6.7 from clock-weighted rounded study rows; shots ≈116 as reported.</text><text x="35" y="443" font-size="12" fill="#545e69" font-weight="400" text-anchor="start">NHL: per scheduled game; Hockey-Reference league averages. Not a calibration target.</text></g></svg>
