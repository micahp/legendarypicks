<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" width="760" height="650" role="img" aria-labelledby="title desc">
<title id="title">Three NFL sequence execution strategies</title><desc id="desc">Target architecture with shared pre-snap policy, three different play outcome engines and common rules and forecasts. Shared interfaces are not all integrated.</desc>
