<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 818" width="760" height="818" role="img" aria-labelledby="title desc"><title id="title">Four historical row-conditioning methods</title><desc id="desc">Fixed-layout comparison of legacy, simplified, support-aware and soft conditioning, starting from the same mandatory eligible event pool.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52667b"/></marker></defs><rect width="760" height="818" rx="12" fill="#f8fafc"/><g font-family="Arial,Helvetica,sans-serif" fill="#162b43" font-size="17"><text x="26" y="39" font-size="24" font-weight="700">Four historical row-conditioning methods</text><text x="26" y="65" font-size="15" fill="#52667b">All methods start with the same mandatory eligible event pool and base weights.</text><rect x="26" y="84" width="708" height="151" rx="10" fill="#eaf1fa" stroke="#c9d7e7"/><text x="43" y="111" font-size="18" font-weight="700">Legacy — sequential filters</text><rect x="44" y="127" width="360" height="86" rx="8" fill="#fff" stroke="#285a99" stroke-width="1.6"/><text x="224" y="165" text-anchor="middle" font-size="17">Apply next optional filter</text><text x="224" y="182" text-anchor="middle" font-size="15"><tspan x="224">Keep nonempty matches;</tspan><tspan x="224" dy="18">skip empty match</tspan></text><path d="M404 170H426" stroke="#52667b" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="428" y="127" width="288" height="86" rx="8" fill="#fff" stroke="#285a99" stroke-width="1.6"/><text x="572" y="165" text-anchor="middle" font-size="17">Draw from remaining rows</text><text x="572" y="187" text-anchor="middle" font-size="17">Order dependent</text><rect x="26" y="252" width="708" height="151" rx="10" fill="#e8f4ef" stroke="#c9d7e7"/><text x="43" y="279" font-size="18" font-weight="700">Simplified — filters disabled</text><rect x="44" y="295" width="360" height="86" rx="8" fill="#fff" stroke="#08795d" stroke-width="1.6"/><text x="224" y="333" text-anchor="middle" font-size="17">Keep all mandatory eligible rows</text><text x="224" y="355" text-anchor="middle" font-size="17">Retain base weights</text><path d="M404 338H426" stroke="#52667b" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="428" y="295" width="288" height="86" rx="8" fill="#fff" stroke="#08795d" stroke-width="1.6"/><text x="572" y="333" text-anchor="middle" font-size="17">Draw from base pool</text><text x="572" y="355" text-anchor="middle" font-size="17">No optional row restriction</text><rect x="26" y="420" width="708" height="151" rx="10" fill="#eaf1fa" stroke="#c9d7e7"/><text x="43" y="447" font-size="18" font-weight="700">Support-aware — relax filters</text><rect x="44" y="463" width="360" height="86" rx="8" fill="#fff" stroke="#285a99" stroke-width="1.6"/><text x="224" y="501" text-anchor="middle" font-size="17">Intersect all optional conditions</text><text x="224" y="518" text-anchor="middle" font-size="15"><tspan x="224">Relax one at a time until</tspan><tspan x="224" dy="18">support is adequate</tspan></text><path d="M404 506H426" stroke="#52667b" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="428" y="463" width="288" height="86" rx="8" fill="#fff" stroke="#285a99" stroke-width="1.6"/><text x="572" y="501" text-anchor="middle" font-size="17">Draw from remaining rows</text><text x="572" y="523" text-anchor="middle" font-size="17">Log inadequate base support</text><rect x="26" y="588" width="708" height="151" rx="10" fill="#e8f4ef" stroke="#c9d7e7"/><text x="43" y="615" font-size="18" font-weight="700">Soft — continuous weights</text><rect x="44" y="631" width="360" height="86" rx="8" fill="#fff" stroke="#08795d" stroke-width="1.6"/><text x="224" y="669" text-anchor="middle" font-size="17">Bound and shrink condition ratios</text><text x="224" y="691" text-anchor="middle" font-size="17">Combine using geometric mean</text><path d="M404 674H426" stroke="#52667b" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="428" y="631" width="288" height="86" rx="8" fill="#fff" stroke="#08795d" stroke-width="1.6"/><text x="572" y="664" text-anchor="middle" font-size="15"><tspan x="572">Draw using base ×</tspan><tspan x="572" dy="18">contextual weights</tspan></text><text x="572" y="691" text-anchor="middle" font-size="17">No optional hard exclusions</text><text x="26" y="774" font-size="15" fill="#52667b">Support-aware defaults: at least 20 candidate rows and effective sample size (ESS) ≥ 10.</text><text x="26" y="797" font-size="15" fill="#52667b">Soft defaults: likelihood ratio cap 4; shrinkage prior 25. Research, not adopted defaults.</text></g></svg>
