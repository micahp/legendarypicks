<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 685" width="760" height="685" role="img" aria-labelledby="title desc"><title id="title">CEG: fit once, generate events at runtime</title><desc id="desc">Offline fitting converts cutoff-valid historical play-by-play to a parameter artifact. Runtime consumes the artifact and current state, generates typed play facts, updates rules and statistics, and loops until the game is complete.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52667b"/></marker></defs><rect width="760" height="685" rx="12" fill="#f8fafc"/><g font-family="Arial,Helvetica,sans-serif" fill="#162b43" font-size="17"><text x="26" y="39" font-size="24" font-weight="700">CEG: fit once, generate events at runtime</text>
<text x="26" y="64" font-size="15" fill="#52667b">Historical play-by-play is training data, not an inference-time row inventory.</text>
<rect x="26" y="83" width="708" height="219" rx="10" fill="#eaf1fa" stroke="#c9d7e7"/>
<text x="46" y="111" font-size="18" font-weight="700">Offline fit</text>
<rect x="47" y="132" width="201" height="78" rx="8" fill="#fff" stroke="#285a99" stroke-width="1.6"/><text x="147.5" y="166" text-anchor="middle" font-size="17">Cutoff-valid</text><text x="147.5" y="188" text-anchor="middle" font-size="17">historical PBP</text>
<rect x="279" y="132" width="201" height="78" rx="8" fill="#fff" stroke="#285a99" stroke-width="1.6"/><text x="379.5" y="166" text-anchor="middle" font-size="17">Timing-separated</text><text x="379.5" y="188" text-anchor="middle" font-size="17">features and labels</text>
<rect x="511" y="132" width="201" height="78" rx="8" fill="#fff" stroke="#285a99" stroke-width="1.6"/><text x="611.5" y="166" text-anchor="middle" font-size="17">Fit and shrink</text><text x="611.5" y="188" text-anchor="middle" font-size="17">distributions</text>
<path d="M248 171H277" stroke="#52667b" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M480 171H509" stroke="#52667b" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M611 210V233H380V242" stroke="#52667b" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="222" y="244" width="316" height="42" rx="8" fill="#fff" stroke="#285a99" stroke-width="1.6"/><text x="380" y="271" text-anchor="middle" font-size="17">Versioned parameter artifact</text>
<rect x="26" y="328" width="708" height="322" rx="10" fill="#e8f4ef" stroke="#c4dbd2"/>
<text x="46" y="356" font-size="18" font-weight="700">Inference — no historical row lookup</text>
<path d="M380 286V378" stroke="#52667b" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="47" y="380" width="201" height="72" rx="8" fill="#fff" stroke="#08795d" stroke-width="1.6"/><text x="147.5" y="411" text-anchor="middle" font-size="17">Frozen matchup</text><text x="147.5" y="433" text-anchor="middle" font-size="17">and game state</text>
<rect x="279" y="380" width="201" height="72" rx="8" fill="#fff" stroke="#08795d" stroke-width="1.6"/><text x="379.5" y="411" text-anchor="middle" font-size="17">Conditional intent</text><text x="379.5" y="433" text-anchor="middle" font-size="17">and outcome draws</text>
<rect x="511" y="380" width="201" height="72" rx="8" fill="#fff" stroke="#08795d" stroke-width="1.6"/><text x="611.5" y="411" text-anchor="middle" font-size="17">Typed</text><text x="611.5" y="433" text-anchor="middle" font-size="17">GeneratedPlay</text>
<path d="M248 416H277" stroke="#52667b" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M480 416H509" stroke="#52667b" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M611 452V476H380V491" stroke="#52667b" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="222" y="493" width="316" height="58" rx="8" fill="#fff" stroke="#08795d" stroke-width="1.6"/><text x="380" y="528" text-anchor="middle" font-size="17">Rules, clock and statistics</text>
<path d="M380 551V573" stroke="#52667b" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="222" y="575" width="316" height="53" rx="8" fill="#fff" stroke="#08795d" stroke-width="1.6"/><text x="380" y="607.5" text-anchor="middle" font-size="17">Game complete? Forecasts</text>
<path d="M222 601H92V454" stroke="#52667b" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="104" y="588" font-size="15" fill="#52667b">Next snap</text>
<text x="26" y="673" font-size="15" fill="#52667b">Conceptual runtime boundary at the reviewed CEG pin; player-aware candidate is separate.</text>
</g></svg>
