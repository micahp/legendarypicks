<text x="551" y="206" font-size="15" fill="#08795d">Estimated</text><text x="551" y="225" font-size="15" fill="#08795d">catch point</text>
<path d="M640 286h26m-13-13v26" stroke="#ad422f" stroke-width="2"/>
<text x="608" y="319" font-size="15" fill="#ad422f">Outside zone</text>
<text x="26" y="379" font-size="15" fill="#4e6074">Break after an observed throw, reaction delay and a reachable opportunity.</text>
<text x="26" y="402" font-size="15" fill="#4e6074">Zone and cone are illustrative, not engine dimensions or measured trajectories.</text>

