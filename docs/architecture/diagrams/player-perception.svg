<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" role="img" aria-labelledby="title desc">
<title id="title">Perception before pursuit</title><desc id="desc">Top-down conceptual sketch of a defender's observation cone, assigned zone, and estimated catch point. Geometry and timing are illustrative.</desc>
