<text x="175" y="164" font-size="15" fill="#285a99">Observed field</text>
<circle cx="365" cy="260" r="20" fill="#285a99" stroke="#fff" stroke-width="2"/><text x="365" y="265" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">DB</text><circle cx="484" cy="176" r="20" fill="#a65b29" stroke="#fff" stroke-width="2"/><text x="484" y="181" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">WR</text>
