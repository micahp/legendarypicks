<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img" aria-labelledby="title desc">
<title id="title">Ball flight: catch point vs ground landing</title><desc id="desc">Side-view schematic comparing a defender's estimated catch-height target and estimated ground landing. Both targets lie on one illustrative trajectory.</desc>
