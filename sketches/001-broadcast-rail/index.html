<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variant A: Broadcast Rail</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap');
  body { background: #09090b; font-family: 'Inter', -apple-system, sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  /* breathing left edge */
  @keyframes breathe {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  .live-edge {
    border-left: 3px solid rgb(16 185 129 / 0.6);
    animation: breathe 2s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .live-edge { animation: none; border-left-color: rgb(16 185 129 / 0.8); }
  }
</style>
</head>
<body class="flex items-center justify-center min-h-screen p-8">

<div class="w-full max-w-2xl space-y-8">

  <!-- label -->
  <div class="flex items-center gap-3">
    <h2 class="text-sm font-semibold uppercase tracking-[0.15em] text-zinc-500">Variant A — Broadcast Rail</h2>
    <div class="h-px flex-1 bg-zinc-800"></div>
  </div>

  <!-- === VARIANT A: Broadcast Rail === -->
  <div class="live-edge rounded-r-xl bg-zinc-900">

    <!-- featured game -->
    <a href="#" class="block px-5 py-4 hover:bg-zinc-800/50 transition-colors rounded-r-xl group">
      <div class="flex items-center gap-2 mb-3">
        <span class="text-[10px] font-semibold uppercase tracking-[0.15em] text-emerald-400">MLB</span>
        <span class="text-[10px] text-zinc-600">·</span>
        <span class="text-[10px] font-medium uppercase tracking-[0.1em] text-zinc-500">live</span>
      </div>

      <div class="flex items-center justify-between">
        <!-- away -->
        <div class="flex-1 min-w-0">
          <div class="text-xs font-semibold text-zinc-500 uppercase tracking-wide mb-1">PIT</div>
          <div class="font-mono text-5xl font-extrabold tabular-nums text-zinc-100 tracking-tight">3</div>
          <div class="text-xs text-zinc-500 mt-1 truncate">Pirates</div>
        </div>

        <!-- vs -->
        <div class="shrink-0 px-6 text-center">
          <div class="text-[10px] font-semibold uppercase tracking-[0.2em] text-zinc-600">vs</div>
        </div>

        <!-- home -->
        <div class="flex-1 min-w-0 text-right">
          <div class="text-xs font-semibold text-zinc-500 uppercase tracking-wide mb-1">NYY</div>
          <div class="font-mono text-5xl font-extrabold tabular-nums text-zinc-100 tracking-tight">3</div>
          <div class="text-xs text-zinc-500 mt-1 truncate">Yankees</div>
        </div>
      </div>
    </a>

    <!-- compact live chips row — always visible -->
    <div class="px-5 pb-4 flex flex-wrap items-center gap-2">
      <a href="#" class="inline-flex items-center gap-1.5 rounded-md border border-zinc-800 bg-zinc-900/70 px-2.5 py-1 text-xs hover:border-zinc-600 transition-colors">
        <span class="text-[10px] font-semibold text-zinc-500">NBA</span>
        <span class="text-zinc-300 font-medium">BOS</span>
        <span class="font-mono text-xs tabular-nums text-zinc-400">102</span>
        <span class="text-zinc-600">–</span>
        <span class="font-mono text-xs tabular-nums text-zinc-400">98</span>
        <span class="text-zinc-300 font-medium">MIA</span>
      </a>
      <a href="#" class="inline-flex items-center gap-1.5 rounded-md border border-zinc-800 bg-zinc-900/70 px-2.5 py-1 text-xs hover:border-zinc-600 transition-colors">
        <span class="text-[10px] font-semibold text-zinc-500">NHL</span>
        <span class="text-zinc-300 font-medium">TOR</span>
        <span class="font-mono text-xs tabular-nums text-zinc-400">2</span>
        <span class="text-zinc-600">–</span>
        <span class="font-mono text-xs tabular-nums text-zinc-400">1</span>
        <span class="text-zinc-300 font-medium">MTL</span>
      </a>
      <a href="#" class="inline-flex items-center gap-1.5 rounded-md border border-zinc-800 bg-zinc-900/70 px-2.5 py-1 text-xs hover:border-zinc-600 transition-colors">
        <span class="text-[10px] font-semibold text-zinc-500">ATP</span>
        <span class="text-zinc-300 font-medium truncate max-w-[80px]">Alcaraz</span>
        <span class="font-mono text-xs tabular-nums text-zinc-400">6–4</span>
        <span class="text-zinc-300 font-medium truncate max-w-[80px]">Sinner</span>
      </a>
      <a href="#" class="inline-flex items-center gap-1.5 rounded-md border border-zinc-800 bg-zinc-900/70 px-2.5 py-1 text-xs hover:border-zinc-600 transition-colors">
        <span class="text-[10px] font-semibold text-zinc-500">UFC</span>
        <span class="text-zinc-300 font-medium">Pereira</span>
        <span class="text-zinc-500 text-[10px]">vs</span>
        <span class="text-zinc-300 font-medium">Adesanya</span>
      </a>

      <!-- esports link — subtle, right-aligned spacer -->
      <div class="flex-1"></div>
      <a href="#" class="text-[11px] font-medium text-zinc-600 hover:text-emerald-400 transition-colors">
        Live esports →
      </a>
    </div>

  </div>

</div>

</body>
</html>
